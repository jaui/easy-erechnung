name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # weekly, so renamed release assets at KoSIT / veraPDF are noticed without a push
    - cron: "17 4 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and start scripts
        run: ./gradlew test installDist

      - name: Excel template with sample data
        run: ./gradlew excelVorlage -PoutFile=build/ci/vorlage.xlsx

      - name: "End-to-end: Excel -> e-invoices (Mustang)"
        run: ./gradlew excelRechnungen -Pexcel=build/ci/vorlage.xlsx -PoutDir=build/ci/out

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{ matrix.os }}
          path: |
            build/reports/tests
            build/ci/out
          if-no-files-found: ignore

  validators:
    name: validators (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Download KoSIT and veraPDF from the official sources
        run: ./gradlew pruefprogrammeLaden -Ptools=kosit,verapdf

      - name: Excel template with sample data
        run: ./gradlew excelVorlage -PoutFile=build/ci/vorlage.xlsx

      - name: End-to-end with Mustang, KoSIT and veraPDF
        run: ./gradlew excelRechnungen -Pexcel=build/ci/vorlage.xlsx -PoutDir=build/ci/out -Pxrechnung -Pkosit -Pverapdf

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validator-reports-${{ matrix.os }}
          path: |
            build/reports/tests
            build/ci/out
          if-no-files-found: ignore
